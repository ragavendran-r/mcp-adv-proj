[project]
name = "sampling"
version = "0.1.0"
description = "Demonstration of sampling, logs, roots, and RAG with MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioconsole>=0.8.1",
    "anthropic>=0.53.0",
    "mcp[cli]>=1.9.3",
    "prompt-toolkit>=3.0.51",
    "pyboxen>=1.3.0",
    "python-dotenv>=1.1.0",
    # RAG dependencies
    "chromadb>=0.6.0",
    "pypdf>=4.0.0",
    "google-genai>=1.0.0",
]

[tool.setuptools]
py-modules = ["client", "server", "rag_server", "rag_demo"]
packages = ["core", "rag"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "rag_demo.py",
    "main.py",
    "client.py",
    "mcp_client.py",
    "server.py",
    "core/cli.py",
    "core/cli_chat.py",
    "core/chat.py",
    ".venv/*",
    "sampling.egg-info/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
